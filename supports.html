<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bet Games - Live Support</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Noto Sans Ethiopic', sans-serif;
            background-color: #080705;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* Mobile App Frame Container */
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #12100d;
            border-left: 1px solid rgba(255, 119, 0, 0.2);
            border-right: 1px solid rgba(255, 119, 0, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 481px) {
            .chat-container {
                height: 88vh;
                border-radius: 32px;
                border: 1px solid rgba(255, 119, 0, 0.3);
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 85, 0, 0.15);
            }
        }

        /* Custom Scrollbar for Chat Messages */
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 119, 0, 0.3);
            border-radius: 4px;
        }

        /* Input Glow styling */
        .custom-input {
            background: #0a0907;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .custom-input:focus-within {
            border-color: #FF7700;
            box-shadow: 0 0 15px rgba(255, 119, 0, 0.25);
        }

        /* Orange Action Button Gradient */
        .btn-orange-gradient {
            background: linear-gradient(180deg, #FF7700 0%, #E64A00 100%);
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-orange-gradient:hover {
            background: linear-gradient(180deg, #FF8811 0%, #FF5500 100%);
        }

        .bubble-agent {
            background: rgba(26, 22, 18, 0.9);
            border: 1px solid rgba(255, 119, 0, 0.25);
            border-top-left-radius: 4px;
        }

        .bubble-user {
            background: linear-gradient(135deg, #FF7700 0%, #E64A00 100%);
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Chat Interface Container -->
    <div class="chat-container">
        
        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4 bg-[#12100d] border-b border-white/10 z-10">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/30">
                        <i class="fa-solid fa-headset text-black text-base"></i>
                    </div>
                    <!-- Online Status Badge -->
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-500 border-2 border-[#12100d]"></span>
                </div>
                <div>
                    <h2 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                        Bet Games Support 
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/40 px-1.5 py-0.5 rounded-md font-semibold">24/7</span>
                    </h2>
                    <p class="text-[11px] text-green-400 font-medium">Agent Online • Ready to help</p>
                </div>
            </div>
            <button onclick="window.history.back()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <!-- Chat Message Area -->
        <div id="chatMessages" class="chat-messages flex-1 p-4 overflow-y-auto space-y-4">
            
            <!-- Timestamp Divider -->
            <div class="flex justify-center my-2">
                <span class="text-[10px] bg-white/5 text-gray-400 px-3 py-1 rounded-full uppercase tracking-wider">Today, Live Chat</span>
            </div>

            <!-- Agent Greeting Bubble -->
            <div class="flex items-end gap-2.5 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 text-xs shrink-0 mb-1">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bubble-agent p-3.5 rounded-2xl text-xs text-gray-200 leading-relaxed shadow-md">
                    ሰላም! እንኳን ወደ <b>Bet Games</b> በደህና መጡ። በዛሬው እለት እንዴት ልንረዳዎ እንችላለን? (ማስቀመጫ፣ ማውጣት ወይም ቦነስ ጥያቄዎች ካሉዎት እዚህ ይጻፉልን)
                </div>
            </div>

            <!-- User Initial Question (Optional Echo) -->
            <div class="flex items-end justify-end gap-2.5 max-w-[85%] ml-auto">
                <div class="bubble-user p-3.5 rounded-2xl text-xs text-white leading-relaxed shadow-md">
                    ሰላም፣ የ100 ብር ቦነሴን ማውጣት እችላለሁ?
                </div>
            </div>

            <!-- Agent Reply Bubble -->
            <div class="flex items-end gap-2.5 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 text-xs shrink-0 mb-1">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bubble-agent p-3.5 rounded-2xl text-xs text-gray-200 leading-relaxed shadow-md">
                    ውድ ደንበኛችን <b>ቦነስ ማውጣት አይቻልም !</b> ቦነሱ ለጨዋታ መዝናኛ ብቻ የሚያገለግል ሲሆን፣ ከጨዋታ የሚያገኙትን ትርፍ ብቻ ማውጣት ይችላሉ። 
                </div>
            </div>

        </div>

        <!-- Quick Suggestions / Shortcuts -->
        <div class="px-4 py-2 bg-[#12100d]/80 border-t border-white/5 flex gap-2 overflow-x-auto no-scrollbar">
            <button onclick="sendQuickMessage('የዲፖዚት (Deposit) ችግር አለብኝ')" class="text-[11px] bg-white/5 hover:bg-orange-500/20 border border-white/10 hover:border-orange-500/40 text-gray-300 px-3 py-1.5 rounded-full whitespace-nowrap transition-all">
                💰 የዲፖዚት ችግር
            </button>
            <button onclick="sendQuickMessage('ቦነስ እንዴት እጠቀማለሁ?')" class="text-[11px] bg-white/5 hover:bg-orange-500/20 border border-white/10 hover:border-orange-500/40 text-gray-300 px-3 py-1.5 rounded-full whitespace-nowrap transition-all">
                🎁 የቦነስ ደንብ
            </button>
            <button onclick="sendQuickMessage('የቴሌብር (Telebirr) ቁጥርዎ ስንት ነው?')" class="text-[11px] bg-white/5 hover:bg-orange-500/20 border border-white/10 hover:border-orange-500/40 text-gray-300 px-3 py-1.5 rounded-full whitespace-nowrap transition-all">
                📱 የቴሌብር ቁጥር
            </button>
        </div>

        <!-- Message Input Bar -->
        <form onsubmit="handleSendMessage(event)" class="p-3 bg-[#12100d] border-t border-white/10 flex items-center gap-2">
            <div class="custom-input rounded-2xl flex-1 px-4 py-2.5 flex items-center gap-2">
                <input type="text" id="messageInput" placeholder="መልዕክትዎን እዚህ ይጻፉ..." autocomplete="off" required
                    class="bg-transparent w-full text-white text-xs focus:outline-none placeholder-gray-500">
                <button type="button" class="text-gray-400 hover:text-orange-400 transition-colors">
                    <i class="fa-solid fa-paperclip text-sm"></i>
                </button>
            </div>
            <button type="submit" class="w-11 h-11 rounded-2xl btn-orange-gradient flex items-center justify-center text-white shrink-0 active:scale-95 transition-all shadow-lg">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </form>

    </div>

    <!-- JavaScript Chat Interactivity -->
    <script>
        const chatMessages = document.getElementById('chatMessages');

        // Scroll chat to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Send Quick Preset Message
        function sendQuickMessage(text) {
            document.getElementById('messageInput').value = text;
        }

        // Handle User Message Submission
        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            // 1. Append User Message
            appendMessage(text, 'user');
            input.value = '';
            scrollToBottom();

            // 2. Simulate Agent Reply after 1 second
            setTimeout(() => {
                let replyText = "መልዕክትዎ ደርሶናል! የደንበኞች አገልግሎት ሠራተኛ ወዲያውኑ ምላሽ ይሰጥዎታል።";
                
                if (text.includes("ቦነስ") || text.includes("bonus")) {
                    replyText = "ውድ ደንበኛችን ቦነስ ማውጣት አይቻልም ! ቦነሱ በጨዋታዎች ላይ ብቻ የሚሰጥ የማበረታቻ ስጦታ ነው።";
                } else if (text.includes("ዲፖዚት") || text.includes("deposit")) {
                    replyText = "ዲፖዚት ለማድረግ በድረገጻችን ላይ የሚገኘውን የቴሌብር ቁጥር (0944325575) በመጠቀም ገንዘብ ልከው የደረሰኝ ቁጥሩን ማስገባት ይችላሉ።";
                } else if (text.includes("ቁጥር") || text.includes("telebirr")) {
                    replyText = "ኦፊሴላዊ የቴሌብር መላኪያ ቁጥራችን 0944325575 ነው።";
                }

                appendMessage(replyText, 'agent');
                scrollToBottom();
            }, 1000);
        }

        // Helper to append message bubbles dynamically
        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-end gap-2.5 max-w-[85%] ${isUser ? 'ml-auto justify-end' : ''}`;

            if (!isUser) {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 text-xs shrink-0 mb-1">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bubble-agent p-3.5 rounded-2xl text-xs text-gray-200 leading-relaxed shadow-md">
                        ${text}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="bubble-user p-3.5 rounded-2xl text-xs text-white leading-relaxed shadow-md">
                        ${text}
                    </div>
                `;
            }

            chatMessages.appendChild(wrapper);
        }

        // Initial scroll on load
        window.onload = scrollToBottom;
    </script>
</body>
</html>
